<header class="top"><div class="brand"><span>♞</span><span>ATELIER DES OUVERTURES</span></div><span class="offline">100 % local · sans serveur</span></header>
<main class="shell">
<section aria-label="Échiquier d’entraînement">
<div class="board-head"><div><p class="eyebrow">APPRENDRE UNE LIGNE</p><h1 id="title"></h1><p id="intro" class="muted"></p></div><button id="flip" class="icon" aria-label="Retourner l’échiquier" title="Retourner l’échiquier">⇅</button></div>
<div class="board-wrap"><div id="board" class="board" role="group" aria-label="Cases de l’échiquier"></div><svg class="arrows" viewBox="0 0 800 800" aria-hidden="true"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f0c060"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65bee2"/></marker></defs><line id="arrow"/></svg></div>

</section>
<aside class="sidebar">
<section class="panel opening-panel"><label for="practice-select">Choisir un entraînement</label><select id="practice-select"><option value="classic">Ouvertures classiques</option><option value="fegatello">Répondre à Fégatello</option><option value="berger">Répondre au coup du Berger</option></select>
<div id="classic-options"><label for="opening-select">Choisir une ouverture</label><select id="opening-select" aria-label="Ouverture"></select></div>
<div id="attack-options" hidden><label for="variant-select">Variante à travailler</label><select id="variant-select"></select><div id="order-options"><label for="order-select">Parcours des variantes</label><select id="order-select"><option value="rotation">Rotation · dans l’ordre</option><option value="random">Aléatoire · sans répétition</option></select></div><p>Joue les Noirs. Toutes les variantes sont proposées avant le tour suivant.</p><button id="new-variant" type="button">Variante suivante</button><p id="coverage-progress" aria-live="polite"></p><p id="practice-progress" aria-live="polite"></p></div>
<fieldset class="mode-picker"><legend>Mode de jeu</legend><div class="mode-options">
<label class="mode-option"><input type="radio" name="mode" value="white">Blancs</label>
<label class="mode-option"><input type="radio" name="mode" value="black">Noirs</label>
<label class="mode-option"><input type="radio" name="mode" value="autonomous" checked>Autonome</label>
</div></fieldset></section>
<section class="panel training-panel"><h2>Parcourir la ligne</h2><p id="variant-label" class="variant-label" aria-live="polite" hidden></p>
<div class="controls"><button id="first" aria-label="Début">⏮</button><button id="prev" aria-label="Coup précédent">←</button><span id="step" class="step-label"></span><button id="next" aria-label="Coup suivant">→</button><button id="last" aria-label="Fin">⏭</button></div>
<div class="actions"><button id="hint">Indice</button><button id="answer" class="primary">Voir la réponse</button><button id="reset">Recommencer</button></div>
<p id="status" class="status" aria-live="polite"></p><p id="feedback" class="feedback" role="status" hidden></p><div id="move-note" class="move-note" hidden><strong id="move-title"></strong><p id="move-detail"></p></div></section>
<section class="panel moves-panel"><div class="panel-heading"><h2>Suite de coups</h2><button id="toggle-sequence" type="button" aria-label="Révéler la suite de coups">Révéler</button></div><div id="sequence" class="sequence blurred" aria-hidden="true"></div><div class="legend">Révèle la suite pour revenir à un coup précis.</div></section>

</aside>
</main>

  if(shown)assists++;else correctAnswers++;
  feedback=(shown?"Réponse montrée : ":"Bonne réponse pour cette variante : ")+move.san+". "+move.note;feedbackKind=shown?"help":"correct";
  renderSequence();go(step+1,true);return
 }
 const game=rulesAt();let played;
 try{played=game.move({from,to})}catch{}
 const reason=played?`Le coup ${played.san} est légal, mais ne fait pas partie des réponses travaillées ici. `+(replyThreat(game)||"Ce n’est pas une évaluation de sa force."):illegalMoveReason(game,from,to);
 wrongAnswers++;feedbackKind="wrong";
 feedback=reason+" Objectif de la réponse étudiée : "+opening.moves[step].note+" Essaie encore, la position est conservée.";
 selected="";preview=null;hintLevel=0;render()
}
function initialBoard(){const b={};for(let i=0;i<8;i++){b[files[i]+"2"]="wp";b[files[i]+"7"]="bp";b[files[i]+"1"]="w"+"rnbqkbnr"[i];b[files[i]+"8"]="b"+"rnbqkbnr"[i]}return b}
function makeMove(b,uci){const from=uci.slice(0,2),to=uci.slice(2,4),p=b[from];if(!p)return;b[to]=uci[4]?p[0]+uci[4]:p;delete b[from];if(p[1]==="k"&&Math.abs(files.indexOf(from[0])-files.indexOf(to[0]))===2){const rank=from[1],short=to[0]==="g",rf=(short?"h":"a")+rank,rt=(short?"f":"d")+rank;b[rt]=b[rf];delete b[rf]}}
function boardAt(n){const b=initialBoard();for(let i=0;i<n;i++)makeMove(b,opening.moves[i].uci);return b}
function squareAt(row,col){return files[flipped?7-col:col]+(flipped?row+1:8-row)}
function center(square){let col=files.indexOf(square[0]),row=8-Number(square[1]);return[(flipped?7-col:col)*100+50,(flipped?7-row:row)*100+50]}
function showMessage(text){message=text;document.getElementById("status").textContent=text}
function autoTurn(){return step<opening.moves.length&&((mode==="white"&&step%2===1)||(mode==="black"&&step%2===0))}
function cancelReply(){if(replyTimer!==null){clearTimeout(replyTimer);replyTimer=null}}
function updateSequenceVisibility(){const el=document.getElementById("sequence"),button=document.getElementById("toggle-sequence");el.classList.toggle("blurred",sequenceHidden);el.inert=sequenceHidden;el.setAttribute("aria-hidden",String(sequenceHidden));button.textContent=sequenceHidden?"Révéler":"Flouter";button.setAttribute("aria-label",sequenceHidden?"Révéler la suite de coups":"Flouter la suite de coups")}
function playDraggedMove(from,to){
 if(step>=opening.moves.length||autoTurn()||from===to)return;
 if(training){playTrainingMove(from,to);return}
 const expected=opening.moves[step].uci;
 if(from+to===expected.slice(0,4)){const move=opening.moves[step];go(step+1,true);if(mode==="autonomous")showMessage("Bonne réponse : "+move.san+". "+move.note)}
 else{selected="";preview=null;hintLevel=0;render();showMessage("Ce n’est pas le coup de cette ligne. Essaie encore ou demande un indice.")}
}
function clickSquare(square,b){
 if(step>=opening.moves.length)return;
 if(autoTurn()){showMessage(replyTimer!==null?"Attends la réponse automatique.":"Ce coup appartient à l’autre camp. Utilise « Voir la réponse » pour continuer.");return}
 const side=step%2===0?"w":"b";
 if(b[square]?.[0]===side){
  selected=selected===square?"":square;preview=null;message="";render();return
 }
 if(!selected){showMessage("Sélectionne une pièce du camp qui doit jouer.");return}
 preview={from:selected,to:square};selected="";hintLevel=0;message="Trajet affiché. Glisse la pièce pour jouer le coup.";render()
}
function updateDragGhost(x,y){
 if(!dragState?.ghost)return;
 dragState.ghost.style.left=x-dragState.ghost.width/2+"px";
 dragState.ghost.style.top=y-dragState.ghost.height/2+"px"
}
const boardElement=document.getElementById("board");
boardElement.addEventListener("pointerdown",e=>{
 const cell=e.target.closest(".sq"),square=cell?.dataset.square,piece=boardAt(step)[square];
 if(!cell||!piece||step>=opening.moves.length||autoTurn()||(e.pointerType==="mouse"&&e.button!==0)||piece[0]!== (step%2===0?"w":"b"))return;
 dragState={id:e.pointerId,from:square,x:e.clientX,y:e.clientY,cell,dragging:false,ghost:null}
});
boardElement.addEventListener("pointermove",e=>{
 if(!dragState||e.pointerId!==dragState.id)return;
 if(!dragState.dragging&&Math.hypot(e.clientX-dragState.x,e.clientY-dragState.y)<8)return;
 if(!dragState.dragging){
  dragState.dragging=true;dragState.cell.classList.add("dragging");
  const image=dragState.cell.querySelector(".piece"),ghost=image.cloneNode();
  ghost.className="drag-ghost";ghost.alt="";ghost.draggable=false;
  const size=dragState.cell.getBoundingClientRect().width*.82;
  ghost.width=size;ghost.height=size;document.body.append(ghost);dragState.ghost=ghost;
  boardElement.setPointerCapture?.(e.pointerId)
 }
 e.preventDefault();updateDragGhost(e.clientX,e.clientY)
});
function finishDrag(e){
 if(!dragState||e.pointerId!==dragState.id)return;
 const {from,dragging,cell,ghost}=dragState;
 if(dragging){
  e.preventDefault();suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},0);
  cell.classList.remove("dragging");ghost?.remove();
  if(boardElement.hasPointerCapture?.(e.pointerId))boardElement.releasePointerCapture(e.pointerId);
  const target=e.type==="pointerup"?document.elementFromPoint(e.clientX,e.clientY)?.closest(".sq"):null;
  dragState=null;
  if(target)playDraggedMove(from,target.dataset.square)
 }else dragState=null
}
boardElement.addEventListener("pointerup",finishDrag);
boardElement.addEventListener("pointercancel",finishDrag);
function draw(){
 const b=boardAt(step),board=document.getElementById("board");board.replaceChildren();
 const move=hintLevel||preview?null:opening.moves[step-1],uci=move?.uci;
 const hinted=opening.moves[step]?.uci,hintFrom=hintLevel>=1?hinted.slice(0,2):null,hintTo=hintLevel>=2?hinted.slice(2,4):null;
 for(let row=0;row<8;row++)for(let col=0;col<8;col++){const sq=squareAt(row,col),piece=b[sq],cell=document.createElement("button");cell.type="button";cell.className="sq "+((row+col)%2?"dark":"light");cell.dataset.square=sq;cell.setAttribute("aria-label",sq+" "+(piece?(piece[0]==="w"?"blanc ":"noir ")+names[piece[1]]:"vide"));if(selected===sq)cell.classList.add("selected");if(sq===hintFrom)cell.classList.add("hint-origin");if(sq===hintTo)cell.classList.add("hint-target");if(uci&&(sq===uci.slice(0,2)||sq===uci.slice(2,4)))cell.classList.add("last");if(col===0){const rank=document.createElement("span");rank.className="coord rank";rank.textContent=sq[1];cell.append(rank)}if(row===7){const file=document.createElement("span");file.className="coord file";file.textContent=sq[0];cell.append(file)}if(piece){cell.classList.add("has-piece");const image=document.createElement("img");image.className="piece";image.src="pieces/kaneo/"+piece[0]+piece[1].toUpperCase()+".svg";image.alt="";image.draggable=false;cell.append(image)}cell.addEventListener("click",()=>{if(suppressNextClick)return;clickSquare(sq,b)});board.append(cell)}
 const arrow=document.getElementById("arrow");const arrowUci=preview?preview.from+preview.to:hintLevel>=3?hinted:uci;if(arrowUci){const a=center(arrowUci.slice(0,2)),z=center(arrowUci.slice(2,4));arrow.setAttribute("x1",a[0]);arrow.setAttribute("y1",a[1]);arrow.setAttribute("x2",z[0]);arrow.setAttribute("y2",z[1]);arrow.setAttribute("class",preview||hintLevel>=3?"blue":"");arrow.style.display=""}else arrow.style.display="none"
}
function render(){
 document.getElementById("title").textContent=training?training.name:opening.name;document.getElementById("intro").textContent=training?(step===opening.moves.length?opening.name+" : "+opening.summary:"Joue les Noirs. Trouve une réponse, puis observe la suite des Blancs."):opening.summary;
 draw();
 const last=opening.moves[step-1],next=opening.moves[step];
 document.getElementById("step").textContent=last?(Math.ceil(step/2)+". "+(step%2?"":"… ")+last.san):"Position initiale";
 document.getElementById("first").disabled=document.getElementById("prev").disabled=step===0;
 document.getElementById("next").disabled=document.getElementById("last").disabled=step===opening.moves.length;
 document.getElementById("hint").disabled=!next||replyTimer!==null||hintLevel>=3;
 document.getElementById("hint").textContent="Indice "+Math.min(hintLevel+1,3)+"/3";
 document.getElementById("answer").disabled=!next||replyTimer!==null;
 document.getElementById("flip").disabled=mode!=="autonomous";
 const status=document.getElementById("status");status.classList.toggle("finished",!next);
 const prompt=!next?(training?"Variante terminée. Rejoue-la ou passe à une autre variante.":"Ligne terminée."):autoTurn()?(replyTimer!==null?"Réponse des "+(step%2?"Noirs":"Blancs")+" dans une seconde…":"Réponse en pause. Utilise « Voir la réponse »."):(step%2?"Noirs":"Blancs")+" : glisse une pièce pour jouer.";
 status.textContent=message||prompt;
 const note=document.getElementById("move-note"),explained=next||last;note.hidden=!!training||!explained;if(explained&&!training){document.getElementById("move-title").textContent=next?"Objectif du prochain coup":"Objectif de "+Math.ceil(step/2)+(step%2?". ":"… ")+last.san;document.getElementById("move-detail").textContent=explained.note}
 const result=document.getElementById("feedback");result.hidden=!training||!feedback;result.textContent=feedback;result.dataset.kind=feedbackKind;
 document.getElementById("practice-progress").textContent=correctAnswers+" réponse(s) trouvée(s) · "+wrongAnswers+" essai(s) à revoir · "+assists+" aide(s)";
 document.getElementById("new-variant").hidden=!!variantFilter;
 document.getElementById("order-options").hidden=!!variantFilter;
 document.getElementById("new-variant").textContent=trainingOrder==="rotation"?"Variante suivante":"Autre variante";
 const variantLabel=document.getElementById("variant-label");variantLabel.hidden=!training;
 if(training){variantLabel.textContent="Variante "+(training.lines.indexOf(opening)+1)+" / "+training.lines.length+" · "+opening.name;const cycle=trainingCycle();document.getElementById("coverage-progress").textContent=variantFilter?"Répétition de la variante sélectionnée":"Tour "+cycle.round+" · "+cycle.seen.size+" / "+training.lines.length+" variantes vues"}
 for(const input of document.querySelectorAll('input[name="mode"]'))input.checked=input.value===mode;
 for(const button of document.querySelectorAll(".move"))button.classList.toggle("active",Number(button.dataset.step)===step);
 document.getElementById("opening-select").value=opening.name;
}
function go(n,auto=false){
 cancelReply();step=Math.max(0,Math.min(opening.moves.length,n));selected="";preview=null;hintLevel=0;message="";
 if(auto&&autoTurn()){const scheduledStep=step;replyTimer=setTimeout(()=>{replyTimer=null;if(step===scheduledStep&&autoTurn())go(step+1,true)},1000)}
 render()
}
function renderLists(){
 const select=document.getElementById("opening-select");
 select.replaceChildren();
 for(const item of openings){const option=document.createElement("option");option.value=item.name;option.textContent=item.name+" · "+item.first;select.append(option)}
 select.addEventListener("change",()=>{opening=openings.find(item=>item.name===select.value);go(0,true);renderSequence()});
 renderSequence()
}
function renderSequence(){const el=document.getElementById("sequence");el.replaceChildren();for(let i=0;i<opening.moves.length;i+=2){const num=document.createElement("span");num.className="num";num.textContent=(i/2+1)+".";el.append(num);for(let j=i;j<Math.min(i+2,opening.moves.length);j++){const b=document.createElement("button");b.className="move";b.dataset.step=j+1;b.textContent=opening.moves[j].san;b.addEventListener("click",()=>go(j+1));el.append(b)}}updateSequenceVisibility();render()}
document.getElementById("flip").addEventListener("click",()=>{if(mode==="autonomous"){flipped=!flipped;render()}});
for(const input of document.querySelectorAll('input[name="mode"]'))input.addEventListener("change",()=>{if(!input.checked||training)return;mode=input.value;flipped=mode==="black";go(0,true)});
document.getElementById("first").addEventListener("click",()=>go(0));
document.getElementById("prev").addEventListener("click",()=>go(step-1));
document.getElementById("next").addEventListener("click",()=>go(step+1));
document.getElementById("last").addEventListener("click",()=>go(opening.moves.length));
document.getElementById("reset").addEventListener("click",()=>{if(training)startExercise(true);else go(0,true)});
document.getElementById("hint").addEventListener("click",()=>{if(step<opening.moves.length&&hintLevel<3){selected="";preview=null;hintLevel++;if(training)assists++;message=["","La pièce à déplacer est éclairée.","La case d’arrivée est éclairée.","Coup conseillé : "+opening.moves[step].san+"."][hintLevel];render()}});
document.getElementById("answer").addEventListener("click",()=>{if(step<opening.moves.length){if(training&&!autoTurn()){const uci=opening.moves[step].uci;playTrainingMove(uci.slice(0,2),uci.slice(2,4),true)}else go(step+1,true)}});
document.getElementById("toggle-sequence").addEventListener("click",()=>{sequenceHidden=!sequenceHidden;updateSequenceVisibility()});
document.getElementById("practice-select").addEventListener("change",selectPractice);
document.getElementById("variant-select").addEventListener("change",()=>{variantFilter=document.getElementById("variant-select").value;startExercise()});
document.getElementById("order-select").addEventListener("change",()=>{trainingOrder=document.getElementById("order-select").value;render()});
document.getElementById("new-variant").addEventListener("click",()=>startExercise());
document.addEventListener("keydown",e=>{if(e.target.closest('select,input,textarea'))return;if(e.key==="ArrowLeft"){e.preventDefault();go(step-1)}if(e.key==="ArrowRight"){e.preventDefault();go(step+1)}});
renderLists();
document.getElementById("copyright-year").textContent=new Date().getFullYear();
</script>
</body>
